<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .color-palette {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .color-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }
        .nav-tabs .nav-link.active {
            color: #000;
            font-weight: bold;
            border-bottom: 2px solid #0d6efd;
        }
    </style>
</head>
<body class="p-4">

    <div class="container">
        <!-- Color Palette -->
        <div class="color-palette">
            <div class="color-circle" style="background-color: #007bff;"></div>
            <div class="color-circle" style="background-color: #17a2b8;"></div>
            <div class="color-circle" style="background-color: #adb5bd;"></div>
            <div class="color-circle" style="background-color: #e67e22;"></div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#basic-info">Basic Info</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#work-experience">Work Experience</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#projects">Projects</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#education">Education</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#achievements">Achievements</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#summary">Summary</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#other">Other</a>
            </li>
        </ul>

        <!-- Download Button -->
        <div class="mt-3 text-end">
            <button class="btn btn-primary dropdown-toggle">Download</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
