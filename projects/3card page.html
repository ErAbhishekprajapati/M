<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Team Section</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #1a0a09;
            color: white;
            text-align: center;
        }
        .team-card {
            background-color: red;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: black;
        }
        .team-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }
        .btn-instagram {
            background-color: black;
            color: red;
            border-radius: 20px;
            padding: 5px 15px;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h2 class="text-danger fw-bold my-4">TEAM</h2>

    <div class="container">
        <div class="row justify-content-center">
            <!-- Founder Card -->
            <div class="col-md-4 mb-4">
                <div class="team-card">
                    <p><strong>01</strong></p>
                    <img src="https://via.placeholder.com/100" alt="Founder">
                    <h5 class="fw-bold">Founder</h5>
                    <p>Lorem45</p>
                    <a href="#" class="btn-instagram"><i class="fab fa-instagram"></i> Instagram</a>
                </div>
            </div>

            <!-- Co-Founder Card 1 -->
            <div class="col-md-4 mb-4">
                <div class="team-card">
                    <p><strong>02</strong></p>
                    <img src="https://via.placeholder.com/100" alt="Co-Founder">
                    <h5 class="fw-bold">Co-Founder</h5>
                    <p>Lorem45</p>
                    <a href="#" class="btn-instagram"><i class="fab fa-instagram"></i> Instagram</a>
                </div>
            </div>

            <!-- Co-Founder Card 2 -->
            <div class="col-md-4 mb-4">
                <div class="team-card">
                    <p><strong>03</strong></p>
                    <img src="https://via.placeholder.com/100" alt="Co-Founder">
                    <h5 class="fw-bold">Co-Founder</h5>
                    <p>Lorem45</p>
                    <a href="#" class="btn-instagram"><i class="fab fa-instagram"></i> Instagram</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
